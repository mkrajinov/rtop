# Node helper pod created by `rtop k8s --node <node>` (research R8), built by
# src/kube/helper.rs::manifest(). Placeholders in <>.
apiVersion: v1
kind: Pod
metadata:
  name: rtop-node-<node>-<rand4>
  namespace: <helper-namespace>
  labels:
    app.kubernetes.io/managed-by: rtop
    rtop.io/role: node-helper        # GC at start deletes only finished pods with this label
    rtop.io/session: <rand>
spec:
  nodeName: <node>
  hostPID: true
  restartPolicy: Never
  activeDeadlineSeconds: 3600        # bounded lifetime if rtop is killed hard (RTOP_HELPER_DEADLINE)
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  enableServiceLinks: false
  tolerations:
    - operator: Exists               # control-plane and tainted nodes too
  containers:
    - name: reader
      image: <debug-image>           # default busybox:1.37
      command: ["sleep", "3600"]     # same as the deadline
      securityContext:
        runAsUser: 0                 # other users' environ/fd/maps need root plus SYS_PTRACE
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["SYS_PTRACE"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 64Mi }
# No hostPath: the reader takes the host's /etc/passwd from /proc/1/root and its network
# counters from /proc/1/net. cgroup files are not read in node mode yet (Story 4); the
# paths in /proc/<pid>/cgroup are relative to the helper's cgroup namespace.
