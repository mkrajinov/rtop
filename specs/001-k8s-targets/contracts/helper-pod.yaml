# Node helper pod created by `rtop --node <node>` (research R8). Placeholders in <>.
apiVersion: v1
kind: Pod
metadata:
  name: rtop-node-<node>-<rand4>
  namespace: <helper-namespace>
  labels:
    app.kubernetes.io/managed-by: rtop
    rtop.io/session: <rand>
spec:
  nodeName: <node>
  hostPID: true
  restartPolicy: Never
  activeDeadlineSeconds: 3600        # bounded lifetime if rtop is killed hard
  terminationGracePeriodSeconds: 0
  tolerations:
    - operator: Exists               # control-plane and tainted nodes too
  containers:
    - name: reader
      image: <debug-image>           # default busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["SYS_PTRACE"]        # read environ/fd/maps of other users' processes
      volumeMounts:
        - name: cgroup
          mountPath: /host/sys/fs/cgroup
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 64Mi }
  volumes:
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
        type: Directory
