# rtop's textbook. One entry per field key used in the UI.
# `linux` / `macos` say where the value comes from on each platform.

# ───────────────────────────── identity ─────────────────────────────

[pid]
title = "PID — process ID"
what = "A number the kernel assigns at fork(). It is unique among live processes, but it gets reused once a process is gone and reaped. On Linux, a 'process' is a thread group, and the PID is the thread-group ID (TGID). Each thread has its own TID, and the main thread's TID equals the PID."
linux = "The /proc/<pid> directory name, and field 1 of /proc/<pid>/stat. It is allocated from a counter that wraps at /proc/sys/kernel/pid_max."
macos = "proc_bsdinfo.pbi_pid, from proc_pidinfo(PROC_PIDTBSDINFO)."
pitfalls = [
  "PIDs are recycled. Tools that track a process over time must pair the PID with its start time. rtop's CPU% tracker does exactly that.",
  "Inside a container, the same process has a different PID in each PID namespace. Look at NSpid in /proc/<pid>/status.",
]
try = ["echo $$", "cat /proc/sys/kernel/pid_max", "ps -o pid,lstart -p $$"]
man = ["proc_pid_stat(5)", "getpid(2)", "pid_namespaces(7)"]

[ppid]
title = "PPID — parent process ID"
what = "The process that forked this one. When a parent dies first, the kernel reparents its children: on Linux to the nearest 'child subreaper' or to PID 1 of the namespace, and on macOS to launchd (PID 1). Only the parent can wait() on a child, which is how exit statuses get collected."
linux = "Field 4 of /proc/<pid>/stat, or PPid: in /proc/<pid>/status."
macos = "proc_bsdinfo.pbi_ppid."
pitfalls = [
  "A PPID of 1 does not always mean 'started by init'. The process may be an orphan that was adopted.",
  "In containers and systemd user sessions, a subreaper can adopt orphans instead of PID 1 (see prctl PR_SET_CHILD_SUBREAPER).",
]
try = ["ps -o pid,ppid,comm -p $$", "pstree -p $$"]
man = ["fork(2)", "wait(2)", "prctl(2)"]

[pgid]
title = "Process group"
what = "A set of processes that the shell treats as one job, e.g. every process in `a | b | c`. Ctrl-C sends SIGINT to the terminal's foreground process group. kill(-pgid, sig) signals the whole group, which is how rtop cleans up lab processes."
linux = "Field 5 (pgrp) of /proc/<pid>/stat."
macos = "proc_bsdinfo.pbi_pgid."
try = ["ps -o pid,pgid,tpgid,comm", "sleep 100 | sleep 100 &  ps -o pid,pgid,comm"]
man = ["setpgid(2)", "credentials(7)"]

[sid]
title = "Session ID"
what = "Sessions group process groups under one controlling terminal. setsid() starts a new session with no controlling terminal; daemons do this to detach from your shell."
linux = "Field 6 of /proc/<pid>/stat."
macos = "Not in proc_bsdinfo. Use getsid(pid), or the SLEADER flag in the Kernel tab."
man = ["setsid(2)", "credentials(7)"]

[uid]
title = "User / UIDs"
what = "Every process carries several user IDs. The real UID says who started it. The effective UID is used for most permission checks. The saved UID lets a set-uid program drop privileges and later regain them. Linux adds an fsUID for file access. The USER column shows the effective UID mapped to a name via /etc/passwd or Directory Services."
linux = "Uid: line of /proc/<pid>/status (real, effective, saved, fs). rtop's table takes the owner of the /proc/<pid> directory, which is the effective UID."
macos = "proc_bsdinfo.pbi_uid (effective), pbi_ruid (real) and pbi_svuid (saved)."
pitfalls = [
  "If real and effective differ, a set-uid binary such as sudo or passwd is running with someone else's identity.",
  "Inside a user namespace, UID 0 can map to an ordinary UID outside. See /proc/<pid>/uid_map.",
]
try = ["id", "ps -o pid,ruser,euser,comm -p $$", "grep Uid /proc/self/status"]
man = ["credentials(7)", "setuid(2)", "user_namespaces(7)"]

[comm]
title = "Command name (comm)"
what = "A short process name, truncated to 15 characters on Linux and 16 or 32 on macOS. By default it is the basename of the executed file. A program can change it with prctl(PR_SET_NAME) or pthread_setname_np, so it is not trustworthy as an identity."
linux = "Field 2 of /proc/<pid>/stat (in parentheses), /proc/<pid>/comm, and Name: in status."
macos = "proc_bsdinfo.pbi_name, which falls back to pbi_comm (MAXCOMLEN = 16)."
pitfalls = [
  "comm can contain spaces and ')' characters. A naive split(' ') of /proc/<pid>/stat breaks on it. Parse from the LAST ')'.",
]
try = ["cat /proc/self/comm", "ps -o comm= -p $$"]
man = ["proc_pid_comm(5)", "prctl(2)"]

[exe]
title = "Executable path"
what = "The file that was execve()'d. If that file was deleted or replaced after start, Linux shows the link target with a ' (deleted)' suffix. This is a classic sign that a binary was upgraded but the process wasn't restarted."
linux = "readlink /proc/<pid>/exe. Only the owner (or CAP_SYS_PTRACE) may read it."
macos = "proc_pidpath(pid), the vnode path of the main executable."
try = ["readlink /proc/self/exe", "ls -l /proc/*/exe 2>/dev/null | grep deleted"]
man = ["proc_pid_exe(5)", "execve(2)"]

[cwd]
title = "Current working directory"
what = "Relative paths resolve against this directory. A process holding a directory open as its cwd keeps that filesystem busy: 'umount: target is busy' often comes down to some shell's cwd."
linux = "readlink /proc/<pid>/cwd."
macos = "proc_pidinfo(PROC_PIDVNODEPATHINFO).pvi_cdir. rtop doesn't show it yet; try lsof -p PID -d cwd."
try = ["readlink /proc/$$/cwd", "lsof -p $$ -d cwd"]
man = ["getcwd(3)", "chdir(2)"]

[container]
title = "CONTAINER — which container of the pod"
what = "A pod is a group of containers that share a network namespace and volumes, but each container normally gets its own PID namespace. So every container has its own PID 1, and the same PID can appear twice in this table. rtop runs a small sh reader in each container (over the API server's pods/exec) and labels every process with the container it came from. With shareProcessNamespace: true the containers share one PID namespace instead; rtop then tells them apart by the cgroup each process is in, and the pod's pause process (which holds the namespace) shows as 'pause'."
linux = "Kubernetes mode only. Per container: the reader's /proc. In a shared namespace: the container ID at the end of /proc/<pid>/cgroup, matched with status.containerStatuses[].containerID of the pod."
macos = "Kubernetes mode reads Linux nodes, even when rtop runs on a Mac."
pitfalls = [
  "PID 1 in one container is not PID 1 in another. In the detail view, NSpid in status shows the same process's PID on the node as well.",
  "Init containers and containers that are not running have no processes; their state is in the pod status (kubectl describe pod).",
]
try = ["kubectl exec POD -c CONTAINER -- cat /proc/1/status", "kubectl get pod POD -o jsonpath='{.status.containerStatuses[*].containerID}'", "kubectl exec POD -- cat /proc/self/cgroup"]
man = ["pid_namespaces(7)", "cgroups(7)"]

[cmdline]
title = "Command line (argv)"
what = "The argument vector passed to execve(). The kernel keeps it in the process's own memory, so a process can overwrite it (some daemons rewrite theirs to show status). Kernel threads have no user memory, so tools show their comm in [brackets]."
linux = "/proc/<pid>/cmdline, with arguments separated by NUL bytes. It is empty for kernel threads and zombies."
macos = "sysctl(CTL_KERN, KERN_PROCARGS2, pid). The buffer is argc, exec_path, padding, argv, then env. Look at the hexdump in the Raw tab."
pitfalls = [
  "Secrets passed as arguments are visible to every user via /proc/<pid>/cmdline (unless /proc is mounted with hidepid). Pass secrets through the environment or files instead.",
]
try = ["tr '\\0' ' ' < /proc/self/cmdline; echo", "ps -o args= -p $$"]
man = ["proc_pid_cmdline(5)", "execve(2)"]

[environ]
title = "Environment"
what = "The environment strings given to execve(). This is a snapshot taken at exec: if the process later calls setenv(), its in-memory copy changes, but what /proc shows usually doesn't."
linux = "/proc/<pid>/environ (NUL-separated). Readable only by the owner."
macos = "The tail of the KERN_PROCARGS2 buffer, after argv. Readable only by the owner."
try = ["tr '\\0' '\\n' < /proc/self/environ | head"]
man = ["environ(7)", "proc_pid_environ(5)"]

[nspid]
title = "PID in each PID namespace"
what = "PID namespaces nest. A process has one PID per level, from the outermost (host) to the innermost (container). Inside a container the main process is often PID 1, which means it inherits init's duties: reaping orphans and special signal handling."
linux = "NSpid: (and NStgid, NSpgid, NSsid) in /proc/<pid>/status."
macos = "No PID namespaces."
try = ["grep NSpid /proc/self/status", "docker run --rm alpine cat /proc/self/status | grep NSpid"]
man = ["pid_namespaces(7)"]

[tracer]
title = "Tracer PID"
what = "Non-zero when another process has attached with ptrace(): a debugger (gdb, lldb), strace, or a sandbox. A traced process stops at every event the tracer asks for, which is why strace slows programs down."
linux = "TracerPid: in /proc/<pid>/status."
macos = "The TRACED flag in proc_bsdinfo.pbi_flags."
try = ["strace -p PID   # then look again", "cat /proc/sys/kernel/yama/ptrace_scope"]
man = ["ptrace(2)"]

[tty]
title = "Controlling terminal"
what = "The terminal whose signals (Ctrl-C, Ctrl-Z, SIGHUP on hang-up) reach this process's session. Daemons have none, and shown as '?' by ps."
linux = "Field 7 (tty_nr) of /proc/<pid>/stat, encoded as a device number (major << 8 | minor)."
macos = "proc_bsdinfo.e_tdev. 0xffffffff (NODEV) means none."
try = ["tty", "ps -o pid,tty,comm"]
man = ["credentials(7)", "tty(4)"]

# ───────────────────────────── state & scheduling ─────────────────────────────

[state]
title = "Process state"
what = "What the scheduler thinks this process is doing right now.\nR running or on a run queue.\nS interruptible sleep: waiting for something, can be woken by a signal.\nD uninterruptible sleep: waiting inside the kernel (usually I/O) and ignoring signals, even SIGKILL.\nT stopped by SIGSTOP or Ctrl-Z.\nt stopped by a debugger.\nZ zombie: exited, waiting for its parent to call wait().\nI idle kernel thread."
linux = "Field 3 of /proc/<pid>/stat, and State: in status (with a word)."
macos = "proc_bsdinfo.pbi_status (SIDL, SRUN, SSLEEP, SSTOP, SZOMB). Almost every live process is SRUN, so rtop refines it with proc_taskinfo.pti_numrunning: R if a thread is on a CPU, S otherwise. '?' means the kernel would not give us task info for that process."
pitfalls = [
  "On Linux, D-state tasks count toward the load average. A load of 50 on an idle CPU usually means stuck I/O (NFS, a dying disk), not CPU pressure.",
  "You cannot kill a zombie. It is already dead. Kill (or fix) its parent, and init/launchd will adopt and reap it.",
  "A process sitting in D for a long time triggers the kernel's 'hung task' warning in dmesg after 120 s.",
]
try = ["ps -eo stat,pid,comm | sort | uniq -c -w1", "cat /proc/loadavg", "rtop lab zombie", "rtop lab dstate"]
man = ["proc_pid_stat(5)", "ps(1)"]

[wchan]
title = "Wait channel (wchan)"
what = "The kernel function a sleeping process is blocked in. This is the first thing to look at for a D-state process: it tells you whether it is stuck on disk, NFS, a lock, or a vfork child."
linux = "/proc/<pid>/wchan, which gives a symbol name such as do_wait or wait_for_vfork_done. Kernels with kptr restrictions may show 0."
macos = "Not exposed per process. Use `sudo spindump PID` or `sample PID` to see where threads block."
try = ["cat /proc/$$/wchan; echo", "ps -o pid,stat,wchan:32,comm"]
man = ["proc_pid_wchan(5)"]

[nice]
title = "Nice value"
what = "How polite a process is about CPU, from -20 (greedy) to 19 (polite). Nice only matters when the CPU is contended. On Linux's fair scheduler, each nice step is about a 10% (×1.25) change in CPU share, so nice 0 vs nice 19 is roughly a 1000:15 ratio. Anyone may raise their own nice value. Lowering it requires root or CAP_SYS_NICE."
linux = "Field 19 of /proc/<pid>/stat."
macos = "proc_bsdinfo.pbi_nice. macOS's scheduler mostly follows QoS classes, so nice has a weaker effect there."
pitfalls = [
  "On an idle multi-core machine, nice 19 and nice 0 run at the same speed. You need more runnable threads than cores to see a difference.",
  "Nice does not affect I/O priority. Use ionice (Linux) or taskpolicy (macOS) for that.",
]
try = ["nice -n 10 sleep 60 &  ps -o pid,ni,pri,comm", "renice +5 -p PID", "rtop lab cpuhog"]
man = ["nice(1)", "setpriority(2)", "sched(7)"]

[priority]
title = "Priority"
what = "The scheduler's internal priority, derived from nice (or set directly for real-time tasks). Different tools print different scales, so compare numbers within one tool only."
linux = "Field 18 of /proc/<pid>/stat. For normal tasks it is 20 + nice (0…39). For real-time tasks it is -2 … -100. ps's PRI column uses yet another scale."
macos = "proc_taskinfo.pti_priority, Mach's 0–127 scale. The timeshare default is 31. Higher means more important, the opposite of Linux."
try = ["ps -o pid,ni,pri,rtprio,cls,comm", "chrt -p $$"]
man = ["sched(7)", "proc_pid_stat(5)"]

[policy]
title = "Scheduling policy"
what = "Which scheduler class runs this task. SCHED_OTHER is the normal fair-share class (CFS, or EEVDF since Linux 6.6). SCHED_FIFO and SCHED_RR are real-time: they always preempt normal tasks, which is why a runaway real-time task can freeze a box. SCHED_BATCH and SCHED_IDLE are for background work. SCHED_DEADLINE is earliest-deadline-first."
linux = "Field 41 of /proc/<pid>/stat. Change it with chrt(1)."
macos = "proc_taskinfo.pti_policy: Mach's POLICY_TIMESHARE, POLICY_RR or POLICY_FIFO."
try = ["chrt -p $$", "sudo chrt -f 10 sleep 30"]
man = ["sched(7)", "chrt(1)"]

[rt_priority]
title = "Real-time priority"
what = "1–99 for SCHED_FIFO and SCHED_RR tasks, and 0 for normal tasks. A higher real-time priority always runs first."
linux = "Field 40 of /proc/<pid>/stat."
macos = "Not exposed this way."
man = ["sched(7)"]

[processor]
title = "Last CPU"
what = "The CPU this task last ran on. Watching it change shows the load balancer migrating tasks between cores. Pinning with taskset stops that."
linux = "Field 39 of /proc/<pid>/stat."
macos = "Not exposed."
try = ["ps -o pid,psr,comm", "taskset -c 0 yes > /dev/null"]
man = ["sched_setaffinity(2)", "taskset(1)"]

[cpus_allowed]
title = "CPU affinity"
what = "The set of CPUs this task may run on. Container runtimes set it via the cgroup cpuset controller. taskset or sched_setaffinity() can narrow it further."
linux = "Cpus_allowed_list: in /proc/<pid>/status."
macos = "macOS has no hard affinity API. Thread affinity tags are only hints."
try = ["grep Cpus_allowed_list /proc/self/status", "taskset -pc $$"]
man = ["sched_setaffinity(2)", "cpuset(7)"]

[schedstat]
title = "Scheduler statistics"
what = "Three counters: time spent running on a CPU, time spent waiting runnable on a run queue, and the number of timeslices. If run-queue wait is high relative to CPU time, the process wants CPU but can't get it. That is CPU saturation, which CPU% alone hides."
linux = "/proc/<pid>/schedstat: on_cpu_ns, runq_wait_ns, timeslices."
macos = "Not exposed. proc_pid_rusage gives ri_runnable_time, a rough equivalent."
try = ["cat /proc/self/schedstat"]
man = ["proc_pid_schedstat(5)"]

[threads]
title = "Threads"
what = "Number of threads (kernel-scheduled entities) in the process. On Linux, threads are tasks that share an address space, created by clone(CLONE_VM|CLONE_THREAD…). Each has its own TID, state and CPU time under /proc/<pid>/task/<tid>/."
linux = "Field 20 (num_threads) of /proc/<pid>/stat. The Threads tab reads /proc/<pid>/task/*/stat."
macos = "proc_taskinfo.pti_threadnum. The Threads tab uses PROC_PIDLISTTHREADS plus PROC_PIDTHREADINFO for each thread."
pitfalls = [
  "RLIMIT_NPROC counts threads, not processes, for the user on Linux. A thread leak can make fork() fail across the whole account.",
]
try = ["ls /proc/self/task", "ps -L -o pid,tid,stat,comm -p PID", "rtop lab threads"]
man = ["clone(2)", "pthreads(7)"]

[ctx_switches]
title = "Context switches"
what = "How many times the task left the CPU. A voluntary switch means it blocked: waiting for I/O, a lock or sleep. An involuntary switch means the scheduler preempted it because its timeslice ran out or a higher-priority task woke up. Many involuntary switches mean CPU contention. Many voluntary switches mean an I/O- or lock-bound workload."
linux = "voluntary_ctxt_switches and nonvoluntary_ctxt_switches in /proc/<pid>/status."
macos = "proc_taskinfo.pti_csw (a single total)."
try = ["grep ctxt /proc/self/status", "pidstat -w 1"]
man = ["proc_pid_status(5)"]

[cpu_percent]
title = "CPU%"
what = "The share of one CPU core this process used since the last refresh. The kernel only keeps cumulative CPU time, so this is (cpu_time_now − cpu_time_before) ÷ wall-clock time between samples. 100% is one full core, so a multi-threaded process can exceed 100%."
linux = "utime + stime (fields 14 and 15 of /proc/<pid>/stat) in clock ticks, converted with sysconf(_SC_CLK_TCK), usually 100 per second."
macos = "proc_taskinfo.pti_total_user + pti_total_system. These are in Mach absolute time units and must be scaled by mach_timebase_info (125/3 on Apple Silicon)."
pitfalls = [
  "The first frame is always 0%. A rate needs two samples.",
  "Linux tick-based accounting is coarse (10 ms). Short-lived processes can run without ever being charged a tick.",
  "ps reports something different. On Linux, ps %CPU is cputime ÷ lifetime (an average since start); macOS ps uses a decaying average. top, htop and rtop show the rate over the last interval.",
]
try = ["top -d 1", "cat /proc/self/stat | awk '{print $14, $15}'", "getconf CLK_TCK"]
man = ["proc_pid_stat(5)", "times(2)"]

[cpu_time]
title = "CPU time (TIME+)"
what = "Total CPU time consumed since the process started. User time is spent running the program's own code. System time is spent in the kernel on its behalf (syscalls, page faults). High system time points at syscall-heavy code or memory pressure."
linux = "Fields 14 (utime) and 15 (stime) of /proc/<pid>/stat, in clock ticks. Fields 16 and 17 add the CPU time of reaped children."
macos = "proc_taskinfo.pti_total_user and pti_total_system, in Mach absolute time units."
try = ["time ls -R / > /dev/null 2>&1", "ps -o pid,time,comm"]
man = ["time(1)", "getrusage(2)"]

[start_time]
title = "Start time"
what = "When the process was created (fork), not when it last exec'd."
linux = "Field 22 of /proc/<pid>/stat, in clock ticks since boot. Add btime from /proc/stat to get a wall-clock time."
macos = "proc_bsdinfo.pbi_start_tvsec and pbi_start_tvusec, already Unix time."
try = ["ps -o pid,lstart,etime,comm -p $$"]
man = ["proc_pid_stat(5)"]

[faults]
title = "Page faults"
what = "A page fault happens when the program touches memory that isn't currently mapped in the page tables. A minor fault is resolved without disk I/O: zero-filling a new page, or mapping a page that is already in the page cache. A major fault needs a disk read. A climbing major-fault count in steady state means the process is thrashing."
linux = "Fields 10 (minflt) and 12 (majflt) of /proc/<pid>/stat."
macos = "proc_taskinfo.pti_faults (all faults) and pti_pageins (faults that needed I/O)."
try = ["/usr/bin/time -v ls 2>&1 | grep -i fault", "ps -o pid,min_flt,maj_flt,comm"]
man = ["getrusage(2)"]

[pageins]
title = "Page-ins"
what = "Faults that had to read a page from disk, either from a mapped file or from swap or the compressor. It is the macOS counterpart of Linux's major faults."
linux = "majflt (field 12 of /proc/<pid>/stat)."
macos = "proc_taskinfo.pti_pageins."
man = ["vm_stat(1)"]

[cow_faults]
title = "Copy-on-write faults"
what = "After fork(), parent and child share every page read-only. The first write to a shared page faults, and the kernel copies just that page. This is why fork() is cheap even for huge processes, and why a forked child's RSS starts out 'shared'."
linux = "Not counted separately. They show up as minor faults."
macos = "proc_taskinfo.pti_cow_faults."
man = ["fork(2)"]

[syscalls]
title = "System calls"
what = "How many times the process entered the kernel. macOS has two syscall families: BSD (Unix: open, read, ...) and Mach traps (IPC, VM, ports)."
linux = "Not counted per process. Use strace -c or perf trace -s."
macos = "proc_taskinfo.pti_syscalls_unix and pti_syscalls_mach."
try = ["strace -c ls > /dev/null", "sudo dtruss -c ls"]
man = ["syscalls(2)", "strace(1)"]

[mach_msgs]
title = "Mach messages"
what = "XNU is built on the Mach microkernel. Much of macOS's IPC (XPC, launchd, WindowServer) runs as messages sent to Mach ports. A chatty process shows high counts here."
linux = "No equivalent. The closest analogues are UNIX sockets or D-Bus."
macos = "proc_taskinfo.pti_messages_sent and pti_messages_received."
man = []

[proc_flags]
title = "Process flags"
what = "Kernel bookkeeping bits about the process: whether it is 64-bit, being traced, a session leader, has a controlling terminal, has changed privileges (set-id) since exec, and so on."
linux = "Field 9 (flags) of /proc/<pid>/stat, with PF_* bits from include/linux/sched.h."
macos = "proc_bsdinfo.pbi_flags, with PROC_FLAG_* bits from <sys/proc_info.h>."
man = []

[qos]
title = "CPU time per QoS class"
what = "macOS schedules threads mostly by Quality of Service class rather than by nice value. User-interactive work (UI) gets performance cores and priority. Background work is sent to efficiency cores and throttled. This breakdown shows where the process spent its CPU time."
linux = "No direct equivalent. The closest are cgroup cpu.weight, nice and SCHED_IDLE."
macos = "rusage_info_v4.ri_cpu_time_qos_*, from proc_pid_rusage."
try = ["taskpolicy -b sleep 10", "man taskpolicy"]
man = ["taskpolicy(8)"]

# ───────────────────────────── memory ─────────────────────────────

[vsz]
title = "VSZ — virtual size"
what = "The total size of every mapping in the address space: code, libraries, heap, stacks, mmap'd files, and reserved-but-untouched regions. It costs almost nothing until pages are touched, so a huge VSZ is normally harmless."
linux = "Field 23 (vsize, bytes) of /proc/<pid>/stat, or VmSize: in status. The Memory tab lists every mapping from /proc/<pid>/maps."
macos = "proc_taskinfo.pti_virtual_size. On macOS every process maps the multi-GB dyld shared cache, so VSZ looks enormous (hundreds of GB) even for `sleep`."
pitfalls = [
  "malloc(1 GiB) increases VSZ immediately, but RSS stays the same until you write to the memory. Run `rtop lab memgrow` to watch it.",
  "Go and Java runtimes reserve large address ranges up front. A big VSZ there is not a leak.",
]
try = ["grep VmSize /proc/self/status", "ps -o pid,vsz,rss,comm"]
man = ["proc_pid_maps(5)", "mmap(2)"]

[rss]
title = "RSS — resident set size"
what = "How much of the process's memory is in RAM right now. It counts private pages and shared pages (libraries, shared memory), and the shared pages are counted in full for every process that maps them. So the RSS of all processes added together can far exceed physical RAM."
linux = "VmRSS: in /proc/<pid>/status, which is RssAnon + RssFile + RssShmem. Field 24 of stat gives the same value in pages."
macos = "proc_taskinfo.pti_resident_size. Activity Monitor prefers 'footprint' (see phys_footprint)."
pitfalls = [
  "RSS double-counts shared libraries. For 'how much would I free by killing this?', look at USS. For a fair share, look at PSS.",
  "Memory that was swapped out or compressed drops out of RSS, but the process still owns it.",
]
try = ["grep -E 'VmRSS|Rss' /proc/self/status", "ps -o pid,rss,comm --sort=-rss | head"]
man = ["proc_pid_status(5)"]

[rss_anon]
title = "RSS: anonymous"
what = "Resident memory that isn't backed by a file: heap, stacks, and private mmap. If it has to be evicted, it can only go to swap. This is usually the number that grows when a program leaks."
linux = "RssAnon: in /proc/<pid>/status."
macos = "No split. Footprint is mostly anonymous memory."
man = ["proc_pid_status(5)"]

[rss_file]
title = "RSS: file-backed"
what = "Resident pages that come from files: the executable, libraries and mmap'd data files. Under pressure the kernel can drop clean file pages and re-read them later, so they are cheap."
linux = "RssFile: in /proc/<pid>/status."
macos = "Not split out."
man = ["proc_pid_status(5)"]

[rss_shmem]
title = "RSS: shared memory"
what = "Resident shmem pages: System V or POSIX shared memory, tmpfs files and MAP_SHARED anonymous mappings."
linux = "RssShmem: in /proc/<pid>/status."
macos = "Not split out."
man = ["shm_overview(7)"]

[hwm]
title = "Peak RSS (VmHWM)"
what = "The highest RSS this process has ever reached (high water mark). Useful for sizing container memory limits."
linux = "VmHWM: in /proc/<pid>/status."
macos = "rusage_info_v4.ri_lifetime_max_phys_footprint is the closest equivalent."
man = ["proc_pid_status(5)"]

[swap]
title = "Swapped out"
what = "Anonymous memory of this process that was moved to swap. It doesn't show up in RSS, but touching it causes a major fault."
linux = "VmSwap: in /proc/<pid>/status."
macos = "macOS compresses memory before swapping. Per-process compressed size is folded into phys_footprint."
man = ["proc_pid_status(5)"]

[vm_data]
title = "Data + heap"
what = "Size of the private writable data mappings, including the brk heap and anonymous mmaps. This is virtual size, not resident memory."
linux = "VmData: in /proc/<pid>/status."
macos = "No summary value. See the MALLOC_* regions in the Memory tab."
man = ["proc_pid_status(5)"]

[vm_stack]
title = "Stack"
what = "Size of the main thread's stack mapping. Thread stacks are separate anonymous mappings."
linux = "VmStk: in /proc/<pid>/status."
macos = "See the STACK regions in the Memory tab."
man = ["proc_pid_status(5)"]

[vm_lib]
title = "Shared library code"
what = "Virtual size of the executable mappings of shared libraries."
linux = "VmLib: in /proc/<pid>/status."
macos = "Libraries live in the dyld shared cache, a single huge shared mapping."
man = ["ld.so(8)"]

[vm_pte]
title = "Page tables"
what = "Memory the kernel uses for this process's page tables. It grows with the amount of mapped memory. With huge sparse mappings it can become surprisingly large, and huge pages help there."
linux = "VmPTE: in /proc/<pid>/status."
macos = "Not exposed."
man = ["proc_pid_status(5)"]

[vm_lck]
title = "Locked memory"
what = "Memory pinned with mlock(). It can never be swapped. Databases and crypto code use it for latency or secrecy. Capped by RLIMIT_MEMLOCK."
linux = "VmLck: in /proc/<pid>/status."
macos = "See wired memory."
man = ["mlock(2)"]

[pss]
title = "PSS — proportional set size"
what = "RSS with shared pages divided fairly: a page shared by 4 processes counts 1/4 to each. Adding up PSS across processes gives real RAM usage, which makes it the best number for 'how much memory does this app really use'."
linux = "Pss: in /proc/<pid>/smaps_rollup. This is expensive for the kernel to compute because it walks the page tables."
macos = "Not available. phys_footprint is the closest attribution metric."
try = ["grep -E '^(Rss|Pss|Private)' /proc/self/smaps_rollup", "smem -k"]
man = ["proc_pid_smaps(5)"]

[uss]
title = "USS — unique set size"
what = "Pages mapped only by this process (Private_Clean + Private_Dirty). It is exactly what you would get back by killing it."
linux = "Private_Clean + Private_Dirty in /proc/<pid>/smaps_rollup."
macos = "Not available directly. `footprint PID` shows similar data."
man = ["proc_pid_smaps(5)"]

[phys_footprint]
title = "Physical footprint"
what = "Apple's main per-process memory metric, shown as 'Memory' in Activity Monitor. It counts dirty anonymous memory, compressed memory and some IOKit and graphics memory charged to the process. It excludes clean file-backed pages that the system could drop. Jetsam uses it to decide which process to kill under memory pressure."
linux = "No single equivalent. The closest is RssAnon + VmSwap, or the cgroup's memory.current."
macos = "rusage_info_v4.ri_phys_footprint, from proc_pid_rusage(RUSAGE_INFO_V4)."
try = ["footprint PID", "vmmap --summary PID"]
man = ["footprint(1)", "vmmap(1)"]

[wired]
title = "Wired memory"
what = "Pages the kernel has pinned in RAM for this process. They can never be paged out."
linux = "The analogue is locked memory (VmLck) or kernel allocations."
macos = "rusage_info_v4.ri_wired_size."
man = []

[mem_percent]
title = "MEM%"
what = "RSS divided by total physical RAM. It inherits RSS's double-counting of shared pages."
linux = "VmRSS ÷ MemTotal (/proc/meminfo)."
macos = "pti_resident_size ÷ sysctl hw.memsize."
man = ["ps(1)"]

[maps]
title = "Memory map (regions)"
what = "Every contiguous range of the address space with its permissions and backing: the binary's text and data, the heap, each thread stack, every shared library, anonymous mmaps, and special kernel pages (vdso). This is the ground truth behind VSZ."
linux = "/proc/<pid>/maps, one line per VMA: address range, perms (r w x p/s), offset, device, inode and path. /proc/<pid>/smaps adds RSS and PSS per region."
macos = "proc_pidinfo(PROC_PIDREGIONPATHINFO) called repeatedly, one region at a time. Share modes: COW, PRV(ate), SHM, NUL (empty), SHR. User tags: MALLOC_*, STACK, DYLIB..."
pitfalls = [
  "Permissions show the mapping's current protection, e.g. a guard page is ---. On macOS the second triple is the maximum protection the region may ever be raised to.",
]
try = ["cat /proc/self/maps", "pmap -x $$", "vmmap PID"]
man = ["proc_pid_maps(5)", "mmap(2)", "vmmap(1)"]

[io_rchar]
title = "Bytes read/written (syscall level)"
what = "Bytes passed through read()/write()-family syscalls, whether or not they reached a disk. This includes pipes, sockets, tty, and reads served from the page cache."
linux = "rchar and wchar in /proc/<pid>/io."
macos = "Not available. ri_logical_writes is the closest."
man = ["proc_pid_io(5)"]

[io_read]
title = "Storage bytes read (READ/s)"
what = "Bytes this process caused to be fetched from storage. READ/s (key i) is the difference between two samples of that total over the seconds between them, like CPU%. A read served from the page cache never reaches the disk and counts 0 here: re-reading a file you just read shows nothing, which is the point. rchar in the detail view counts every byte through read(), cache hits, pipes and sockets included."
linux = "read_bytes in /proc/<pid>/io, needs the kernel's task I/O accounting (CONFIG_TASK_IO_ACCOUNTING). The file is ptrace-gated: another user's process shows — unless rtop runs as root."
macos = "rusage_info_v4.ri_diskio_bytesread from proc_pid_rusage(RUSAGE_INFO_V4). Other users' processes show — (EPERM), like their other task data."
pitfalls = [
  "Readahead is charged to the reader: one small read can count 128K or more.",
  "Memory-mapped files are read by page faults, not read(): they still count here, but not in rchar.",
  "In rtop k8s the columns show —: the reader would need one more file per process per second through a shell, and isn't taught that yet.",
]
try = ["cat /proc/self/io", "iotop -o", "pidstat -d 1", "sudo fs_usage -f diskio   # macOS", "echo 3 | sudo tee /proc/sys/vm/drop_caches   # Linux: make the next read hit the disk"]
man = ["proc_pid_io(5)", "proc_pid_rusage(3)", "iotop(8)"]

[io_write]
title = "Storage bytes written (WRITE/s)"
what = "Bytes this process caused to be written to storage, per second with key i. write() only copies into the page cache and marks pages dirty; the kernel's flusher threads write them out up to ~30 s later. So WRITE/s shows when the process dirtied the data, not when the disk wrote it, and the disk card can be busy while no process seems to write."
linux = "write_bytes in /proc/<pid>/io, charged to the process when it dirties the page (not at writeback). cancelled_write_bytes counts dirty pages thrown away by truncate or unlink before they were written; the net written is the difference."
macos = "rusage_info_v4.ri_diskio_byteswritten from proc_pid_rusage(RUSAGE_INFO_V4)."
pitfalls = [
  "A process that writes then deletes a temp file can show large WRITE/s that never reached the disk (see cancelled_write_bytes).",
  "fsync() makes the process wait for its writes; that time shows as D state on Linux, not as CPU.",
  "In rtop k8s the columns show —; see READ/s.",
]
try = ["cat /proc/self/io", "dd if=/dev/zero of=big bs=1M count=1000; rm big", "grep -E 'Dirty|Writeback' /proc/meminfo", "pidstat -d 1"]
man = ["proc_pid_io(5)", "proc_pid_rusage(3)", "fsync(2)"]

[oom_score]
title = "OOM score"
what = "How likely the Linux OOM killer is to pick this process when memory runs out (0–1000, higher is more likely). It is roughly the process's share of RAM plus swap, shifted by oom_score_adj (-1000 to +1000). -1000 makes a process immune; systemd and the kubelet set it for critical services."
linux = "/proc/<pid>/oom_score and /proc/<pid>/oom_score_adj."
macos = "macOS uses Jetsam priority bands instead. They are not readable without private APIs."
try = ["cat /proc/self/oom_score /proc/self/oom_score_adj", "dmesg | grep -i 'killed process'"]
man = ["proc_pid_oom_score(5)"]

[wakeups]
title = "Wakeups"
what = "How often this process woke a CPU out of idle (package idle wakeups) or was woken by interrupts. Frequent wakeups prevent deep sleep states and drain laptop batteries. It is the classic 'energy impact' metric."
linux = "No per-process counter. powertop estimates it."
macos = "rusage_info_v4.ri_pkg_idle_wkups and ri_interrupt_wkups."
try = ["sudo powermetrics --samplers tasks -n 1"]
man = ["powermetrics(1)"]

[instructions]
title = "Instructions and cycles"
what = "Hardware counters: how many instructions retired and how many CPU cycles were spent. IPC (instructions per cycle) tells you whether the code is compute-bound (high IPC) or stalled on memory or branches (IPC well below 1)."
linux = "Not in /proc. Use perf stat -p PID."
macos = "rusage_info_v4.ri_instructions and ri_cycles."
try = ["perf stat -p PID sleep 5"]
man = ["perf-stat(1)"]

# ───────────────────────────── files ─────────────────────────────

[fds]
title = "Open file descriptors"
what = "Small integers indexing the process's table of open files. Each entry can be a regular file, a directory, a pipe, a socket, a device, an eventfd, an epoll instance, and so on. 0, 1 and 2 are stdin, stdout and stderr by convention. A steadily growing count is an fd leak, which ends in EMFILE ('Too many open files') once it hits RLIMIT_NOFILE."
linux = "Entries of /proc/<pid>/fd/. Each one is a symlink, and sockets appear as socket:[inode]. rtop resolves socket inodes using /proc/<pid>/net/{tcp,udp,unix}. /proc/<pid>/fdinfo/N has the offset and flags."
macos = "proc_pidinfo(PROC_PIDLISTFDS) gives (fd, type) pairs. proc_pidfdinfo(PROC_PIDFDVNODEPATHINFO or PROC_PIDFDSOCKETINFO) gives paths and socket endpoints."
pitfalls = [
  "Deleted-but-open files still use disk space until the last fd is closed. That's why 'df' and 'du' disagree. Find them with `lsof +L1`.",
  "Sockets show only an inode in /proc/<pid>/fd. You have to join it against /proc/net/* to see addresses, which is what ss -p does.",
]
try = ["ls -l /proc/self/fd", "lsof -p $$", "ss -tanp", "rtop lab fdleak"]
man = ["proc_pid_fd(5)", "lsof(8)", "ss(8)"]

# ───────────────────────────── limits ─────────────────────────────

[limits]
title = "Resource limits (rlimits)"
what = "Per-process caps that are inherited across fork and exec. The soft limit is what is enforced. A process may raise its soft limit up to the hard limit, and only privileged processes may raise the hard limit."
linux = "/proc/<pid>/limits, readable for any process you can see. Set with prlimit(1) or ulimit, or with LimitNOFILE= etc. in systemd units."
macos = "getrlimit(2) only works on yourself. There is no API to read another process's rlimits. System-wide caps live in sysctl kern.*."
try = ["cat /proc/self/limits", "ulimit -a", "prlimit -p PID"]
man = ["getrlimit(2)", "prlimit(1)"]

[limit_nofile]
title = "RLIMIT_NOFILE — max open files"
what = "One more than the highest fd number the process may open. When it is reached, open(), socket() and accept() fail with EMFILE. Servers handling many connections need it raised. Many distros default to a soft limit of 1024."
linux = "The 'Max open files' row of /proc/<pid>/limits. The system-wide cap is fs.file-max."
macos = "getrlimit(RLIMIT_NOFILE). It is capped by kern.maxfilesperproc."
try = ["ulimit -n", "ulimit -n 64; python3 -c 'import os;[os.open(\"/dev/null\",0) for _ in range(100)]'"]
man = ["getrlimit(2)"]

[sysctl_limits]
title = "System-wide limits (sysctl)"
what = "Kernel-wide caps that apply above the per-process rlimits."
linux = "/proc/sys/fs/file-max, /proc/sys/kernel/pid_max and /proc/sys/kernel/threads-max."
macos = "sysctl kern.maxfiles, kern.maxfilesperproc, kern.maxproc and kern.maxprocperuid."
try = ["sysctl kern.maxfiles kern.maxfilesperproc", "cat /proc/sys/fs/file-nr"]
man = ["sysctl(8)"]

# ───────────────────────────── kernel mechanisms ─────────────────────────────

[namespaces]
title = "Namespaces"
what = "Namespaces give a process its own view of a global resource. mnt: mount table. pid: PID numbers. net: interfaces, routes, iptables and sockets. uts: hostname. ipc: SysV IPC. user: UID/GID mapping and capabilities. cgroup: cgroup root. time: clocks. A container is essentially a process with its own namespaces plus a cgroup. Two processes are in the same namespace exactly when the inode numbers match."
linux = "/proc/<pid>/ns/* symlinks such as net:[4026531840]. rtop compares each one with its own."
macos = "No namespaces. Docker Desktop and OrbStack run containers inside a Linux VM."
pitfalls = [
  "Entering a namespace (nsenter, setns) does not change the process's cgroup or capabilities. Those are separate mechanisms.",
  "/proc/<pid>/net/* shows the network namespace of <pid>, which is why rtop reads sockets from the target process's own net directory.",
]
try = ["ls -l /proc/self/ns", "lsns", "unshare -Urn ip link", "rtop lab namespace"]
man = ["namespaces(7)", "unshare(1)", "nsenter(1)"]

[cgroup]
title = "Control group (cgroup v2)"
what = "cgroups put processes into a hierarchy and apply resource controls to each node: memory.max (hard limit, after which the OOM killer runs inside the cgroup), cpu.max (quota/period throttling), cpu.weight (fair share), pids.max and io.max. systemd puts every service in its own cgroup, and Kubernetes pod limits are cgroup limits."
linux = "/proc/<pid>/cgroup gives the path ('0::/system.slice/foo.service' on v2). The controls live in /sys/fs/cgroup/<path>/."
macos = "No cgroups. macOS uses coalitions, QoS and jetsam limits instead."
pitfalls = [
  "cpu.max '50000 100000' means 0.5 CPU per 100 ms period. A bursty multi-threaded app can use it up early in the period and then be throttled. Look at cpu.stat nr_throttled.",
  "memory.current includes page cache charged to the cgroup, so it is higher than the sum of RSS.",
]
try = ["cat /proc/self/cgroup", "systemd-cgls", "cat /sys/fs/cgroup/$(cut -d: -f3 /proc/self/cgroup)/memory.current"]
man = ["cgroups(7)", "systemd.resource-control(5)"]

[psi]
title = "Pressure stall information (PSI)"
what = "Measures the percentage of time tasks in this cgroup were stalled waiting for CPU, memory or I/O, as 10-, 60- and 300-second averages. 'some' means at least one task was stalled; 'full' means all were. It tells you directly whether a resource is a bottleneck, which utilisation numbers cannot."
linux = "cpu.pressure, memory.pressure and io.pressure in the cgroup directory. The system-wide values are in /proc/pressure/*."
macos = "No equivalent. The memory_pressure tool covers memory only."
try = ["cat /proc/pressure/cpu /proc/pressure/memory"]
man = ["https://docs.kernel.org/accounting/psi.html"]

[capabilities]
title = "Capabilities"
what = "Linux splits root's power into about 40 capabilities, e.g. CAP_NET_BIND_SERVICE (bind ports below 1024), CAP_NET_ADMIN (configure interfaces and iptables), CAP_SYS_ADMIN (an overloaded 'almost root') and CAP_SYS_PTRACE. The effective set is what the kernel checks. The permitted set is the most the process can enable. The bounding set limits what exec can ever grant. Ambient capabilities survive exec for non-set-uid programs."
linux = "CapInh, CapPrm, CapEff, CapBnd and CapAmb in /proc/<pid>/status (hex bitmasks; decode them with capsh --decode)."
macos = "No capabilities. The equivalents are entitlements in the code signature, TCC privacy permissions and root."
pitfalls = [
  "A process running as root inside a container usually has a reduced bounding set. Compare CapEff for `docker run` with and without --privileged.",
]
try = ["grep Cap /proc/self/status", "capsh --decode=$(grep CapEff /proc/self/status | cut -f2)", "getpcaps $$"]
man = ["capabilities(7)", "capsh(1)"]

[no_new_privs]
title = "no_new_privs"
what = "A one-way flag. Once it is set, execve() can never grant more privileges: set-uid bits and file capabilities are ignored. Unprivileged seccomp filters require it, and container runtimes set it."
linux = "NoNewPrivs: in /proc/<pid>/status. Set it with prctl(PR_SET_NO_NEW_PRIVS)."
macos = "No equivalent."
try = ["setpriv --no-new-privs grep NoNewPrivs /proc/self/status"]
man = ["prctl(2)"]

[seccomp]
title = "Seccomp"
what = "Syscall filtering. In mode 2 (filter) a small BPF program inspects every syscall number and its arguments, and then allows the call, fails it with an errno, or kills the process. Docker's default profile blocks around 44 syscalls. Chrome, systemd services (SystemCallFilter=) and Android all use it."
linux = "Seccomp: in /proc/<pid>/status (0 = off, 1 = strict, 2 = filter). Seccomp_filters: gives the number of stacked filters."
macos = "No seccomp. The App Sandbox (Seatbelt profiles, sandbox-exec) plays a similar role."
try = ["grep Seccomp /proc/self/status", "docker run --rm alpine grep Seccomp /proc/self/status"]
man = ["seccomp(2)"]

[signals]
title = "Signal dispositions"
what = "For each signal, a process can block it (hold it pending), ignore it, or catch it with a handler. SIGKILL and SIGSTOP can never be caught, blocked or ignored. If SIGTERM is caught, the process does its own graceful shutdown. If HUP is ignored, the process was probably started with nohup."
linux = "SigBlk, SigIgn, SigCgt, SigPnd and ShdPnd in /proc/<pid>/status (64-bit masks; bit n-1 is signal n)."
macos = "Not exposed per process."
try = ["grep Sig /proc/self/status", "trap 'echo got TERM' TERM; grep SigCgt /proc/$$/status"]
man = ["signal(7)"]

[sysctl_flags]
title = "Kernel flags"
what = "Miscellaneous per-process kernel flags."
linux = "Field 9 of /proc/<pid>/stat."
macos = "proc_bsdinfo.pbi_flags."
man = []

# ───────────────────────────── views ─────────────────────────────

[raw]
title = "Raw sources"
what = "The data exactly as the kernel produced it, before rtop parsed anything. On Linux these are the text files under /proc, and for stat rtop numbers each field. On macOS they are the C structs returned by proc_pidinfo and friends, dumped field by field. Press `r` on any field in another tab to jump here, with that field highlighted."
linux = "cat the file yourself. Everything in this tab is a plain read()."
macos = "The struct layouts are in <sys/proc_info.h> in the macOS SDK."
try = ["cat /proc/$$/stat", "less $(xcrun --show-sdk-path)/usr/include/sys/proc_info.h"]
man = ["proc(5)"]

[pod]
title = "POD — which pod a node process belongs to"
what = "On a node, every container is just a group of ordinary processes. The container runtime puts each container in its own cgroup, named after the container ID, inside a cgroup for the pod named after the pod UID. rtop reads /proc/<pid>/cgroup of every process and looks both IDs up in the list of pods the API server says run on this node. Processes outside any pod (systemd, kubelet, containerd, sshd, kernel threads) show no pod and the container 'host'. A pod's pause process, which holds its namespaces, has no container status of its own and shows as 'pause'."
linux = "Node mode only. /proc/<pid>/cgroup, e.g. 0::/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod<uid>.slice/cri-containerd-<id>.scope, matched with metadata.uid and status.containerStatuses[].containerID of the pods with spec.nodeName = this node. Static pods (etcd, kube-apiserver) carry a config hash instead of the UID; their mirror pod has it in the kubernetes.io/config.mirror annotation."
macos = "Kubernetes mode reads Linux nodes, even when rtop runs on a Mac."
pitfalls = [
  "rtop reads the node through a helper pod with hostPID, so paths in /proc/<pid>/cgroup are relative to the helper's cgroup namespace and start with /../.. — only the pod and container IDs in them matter.",
  "The systemd cgroup driver writes the pod UID with underscores instead of dashes (pod1b2c3d4e_5f60_...).",
  "A pod that was just created may show as 'host' for a second, until the pod list reaches rtop.",
]
try = ["cat /proc/self/cgroup", "kubectl get pods -A --field-selector spec.nodeName=NODE -o wide", "systemd-cgls (on the node)"]
man = ["cgroups(7)", "cgroup_namespaces(7)", "pid_namespaces(7)"]

[container_meminfo]
title = "Why the memory and cpu cards show the node inside a container"
what = "Namespaces change what a process can see (its PIDs, mounts, network); cgroups limit what it can use. /proc/meminfo, /proc/stat, /proc/loadavg and the CPU count belong to neither: the kernel answers them for the whole machine, from any container. So free, top, nproc and runtimes that size themselves from them (older JVMs, Go before GOMAXPROCS respected quotas, Node.js heap defaults) see the node, not the limit, and may plan for memory they will never get.\nIn pod mode rtop labels the memory and cpu cards 'node' and puts the containers card first: that one is read from each container's own cgroup."
linux = "Node-wide: /proc/meminfo, /proc/stat, /proc/loadavg. The container's share: /sys/fs/cgroup/memory.max, memory.current, cpu.max, cpu.stat (cgroup v2, seen from inside the container's cgroup namespace)."
macos = "Containers run Linux; on a Mac they live in a Linux VM, and the same applies inside it."
pitfalls = [
  "A container whose memory.current reaches memory.max is OOM-killed even though /proc/meminfo shows gigabytes free.",
  "nproc shows the node's cores; cpu.max of 50000 100000 means half of one core.",
  "LXCFS can mount per-container versions of these files over /proc; most Kubernetes clusters do not use it.",
]
try = ["kubectl exec POD -- sh -c 'head -1 /proc/meminfo; cat /sys/fs/cgroup/memory.max'", "kubectl exec POD -- sh -c 'nproc; cat /sys/fs/cgroup/cpu.max'"]
man = ["proc(5)", "cgroups(7)", "cgroup_namespaces(7)"]

[k8s_limits]
title = "Limits — what a container may use"
what = "resources.limits in the pod spec. The kubelet writes them into the container's cgroup: the CPU limit becomes cpu.max (a quota of CPU time per 100 ms period: 500m is '50000 100000'), the memory limit becomes memory.max in bytes. The kernel enforces them, not Kubernetes: a container over its CPU quota waits for the next period (throttling), one over its memory limit is OOM-killed."
linux = "/sys/fs/cgroup/cpu.max and /sys/fs/cgroup/memory.max inside the container; pod.spec.containers[].resources.limits in the API. rtop shows the cgroup values and falls back to the spec when the cgroup cannot be read."
macos = "Not applicable: limits are enforced by the Linux kernel on the node."
pitfalls = [
  "A CPU limit throttles even when the node is idle: the quota is per container, not a share of spare capacity.",
  "No memory limit means the container can use the node's memory until the node runs short, and then the kubelet evicts pods.",
]
try = ["kubectl get pod POD -o jsonpath='{.spec.containers[*].resources}'", "kubectl exec POD -- cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max"]
man = ["cgroups(7)"]

[k8s_requests]
title = "Requests — what the scheduler reserves"
what = "resources.requests decide where a pod is placed: the scheduler only puts it on a node whose allocatable capacity minus the requests already placed there can hold it. At run time the CPU request becomes cpu.weight, the container's share when CPUs are contended. The memory request is not enforced at all; it only matters for scheduling and for which pods the kubelet evicts first under memory pressure."
linux = "pod.spec.containers[].resources.requests; /sys/fs/cgroup/cpu.weight for the CPU part."
macos = "Not applicable."
pitfalls = [
  "Requests far below real usage overcommit the node; requests far above it waste capacity no one else may use.",
  "The QoS class (Guaranteed, Burstable, BestEffort) follows from requests and limits and sets the order of eviction.",
]
try = ["kubectl describe node NODE | grep -A8 'Allocated resources'", "kubectl get pod POD -o jsonpath='{.status.qosClass}'"]
man = ["cgroups(7)"]

[cgroup_cpu_throttled]
title = "Throttled — waiting for the next CPU period"
what = "With a CPU limit the kernel gives the container a quota of CPU time per period (cpu.max, usually 100 ms). When its threads have used the quota, they are not scheduled again until the period ends, even if cores are idle. cpu.stat counts the periods in which that happened (nr_throttled) out of all periods in which it ran (nr_periods), and the total time spent waiting (throttled_usec). rtop shows the share of periods throttled since the last refresh."
linux = "/sys/fs/cgroup/cpu.stat: nr_periods, nr_throttled, throttled_usec."
macos = "Not applicable."
pitfalls = [
  "A multi-threaded program can use a 100 ms quota in 25 ms on four cores and then stall for 75 ms: latency spikes at low average CPU.",
  "100% throttled with usage at the limit means the limit is the bottleneck, not the node.",
]
try = ["kubectl exec POD -- cat /sys/fs/cgroup/cpu.stat"]
man = ["cgroups(7)", "sched(7)"]

[cgroup_oom_kill]
title = "OOM kills — memory.max reached"
what = "When a cgroup's memory use reaches memory.max and the kernel cannot reclaim enough (page cache, swap), the OOM killer ends a process in that cgroup. memory.events counts these in oom_kill. On cgroup v2 the kubelet sets memory.oom.group, so the whole container is killed at once; Kubernetes then reports the container as terminated with reason OOMKilled (exit 137 = 128 + SIGKILL) and restarts it."
linux = "/sys/fs/cgroup/memory.events (oom, oom_kill), memory.oom.group; status.containerStatuses[].lastState.terminated.reason in the API."
macos = "Not applicable."
pitfalls = [
  "After a restart the container has a new cgroup and oom_kill starts again at 0: the restart count and 'last OOMKilled' are the lasting record.",
  "The node can have plenty of free memory: the limit is per container.",
]
try = ["kubectl exec POD -- cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.oom.group", "kubectl get pod POD -o jsonpath='{.status.containerStatuses[*].lastState}'"]
man = ["cgroups(7)"]

[k8s_restarts]
title = "Restarts — the container started again"
what = "The kubelet restarts a container that exits (restartPolicy Always or OnFailure), with a growing back-off between attempts (CrashLoopBackOff). Each restart is a new container: new PIDs, a new cgroup, counters from zero. rtop notices the new container ID, starts a fresh reader and keeps the reason the previous one ended."
linux = "status.containerStatuses[].restartCount and lastState.terminated (reason, exitCode)."
macos = "Not applicable."
pitfalls = [
  "Exit code 137 is SIGKILL: an OOM kill, or a kill after the termination grace period.",
  "A pod's restart count includes restarts from long ago; check lastState for when and why.",
]
try = ["kubectl get pod POD -o wide", "kubectl logs POD --previous"]
man = ["signal(7)"]

[k8s_ephemeral_container]
title = "Ephemeral (debug) containers"
what = "A container added to a running pod through the pods/ephemeralcontainers subresource, as kubectl debug does. With targetContainerName it joins that container's PID namespace, so its tools can see the target's processes in /proc even when the target image has no shell. rtop adds one (busybox) when it cannot run sh in a container."
linux = "pod.spec.ephemeralContainers and status.ephemeralContainerStatuses. The target's files: /proc/1/root/... from inside it."
macos = "Not applicable."
pitfalls = [
  "Ephemeral containers can never be removed or restarted: they stay in the pod spec, terminated, until the pod is deleted.",
  "When the target container restarts, its PID 1 dies and the kernel kills everything in that PID namespace, the debug container included.",
]
try = ["kubectl debug -it POD --image=busybox:1.37 --target=CONTAINER", "kubectl get pod POD -o jsonpath='{.spec.ephemeralContainers[*].name}'"]
man = ["pid_namespaces(7)"]

[k8s_host_pid]
title = "hostPID — the node's PID namespace"
what = "A pod with hostPID: true shares the node's PID namespace, so /proc in it lists every process on the node: systemd, kubelet, containerd and every container. rtop's node view reads the node through such a helper pod. Seeing processes is not the same as reading their details: other users' environ, fd/ and maps also need root and CAP_SYS_PTRACE."
linux = "pod.spec.hostPID. Inside: /proc/1 is the node's init; /proc/1/root is the node's root file system."
macos = "Not applicable."
pitfalls = [
  "Pod Security 'baseline' and 'restricted' forbid hostPID: it needs a namespace allowed 'privileged'.",
  "Root in a hostPID pod can signal any root process on the node, capabilities or not: rtop's node view never sends signals.",
]
try = ["kubectl debug node/NODE -it --image=busybox:1.37 -- ps"]
man = ["pid_namespaces(7)", "capabilities(7)"]

# ───────────────────────────── dashboard ─────────────────────────────

[volumes]
title = "Volumes — space per mounted filesystem"
what = "A block device (a disk or partition) holds a filesystem; mounting attaches it to a directory. One device can be mounted at many places (bind mounts, Docker's /etc/hosts), and many directories you see are not disks at all (proc, sysfs, tmpfs). statvfs(3) asks a filesystem for its block counts: f_blocks in total, f_bfree free, and f_bavail free for unprivileged users, each in units of f_frsize. rtop computes, as df does: size = f_blocks, used = f_blocks − f_bfree, free = f_bavail, used % = used / (used + free). The disk card shows the fullest volumes first; v lists all of them."
linux = "/proc/self/mountinfo lists every mount with its device number (major:minor), filesystem type and source. rtop drops pseudo filesystems, reads each device once at its shortest mount point, and calls statvfs on it. Network and FUSE filesystems are listed but not read, because statvfs on a hung NFS server blocks until it answers."
macos = "getfsstat(2) with MNT_NOWAIT returns a struct statfs per mount from the kernel's cache, without asking each filesystem: f_blocks, f_bfree, f_bavail in units of f_bsize. APFS volumes are grouped per container (see the next lesson)."
pitfalls = [
  "df and du disagree. du adds up the files it can see; df asks the filesystem. A deleted file that a process still has open uses space df counts and du can't see (lsof +L1 lists them). Files hidden under a mount point, snapshots and filesystem metadata also count for df only.",
  "used + free < size. ext4 reserves 5% of blocks for root by default (tune2fs -m); f_bfree includes them, f_bavail doesn't. A disk can be '100% full' for users while root can still write.",
  "A filesystem can also run out of inodes with free blocks left: df -i.",
]
try = ["df -k", "df -i", "findmnt", "cat /proc/self/mountinfo", "lsof +L1", "du -sh /var/* | sort -h"]
man = ["statvfs(3)", "proc_pid_mountinfo(5)", "getfsstat(2)", "df(1)"]

[apfs_container]
title = "APFS containers — volumes that share their space"
what = "On a Mac, one APFS container (a synthesized disk such as disk3) holds several volumes: the sealed, read-only system volume mounted at /, your data at /System/Volumes/Data, plus Preboot, Recovery, VM (swap files) and Update. They don't have fixed sizes; they all take blocks from the container's shared pool. statfs reports the container's total and free blocks for each of them. rtop therefore shows one row per container, named by its browsable mount point, with used = total − free across all its volumes: the number Finder shows."
macos = "getfsstat(2): f_mntfromname /dev/diskNsM… names the container diskN; f_flags MNT_DONTBROWSE (\"nobrowse\" in mount) marks volumes Finder hides. Containers whose volumes are all nobrowse (Xcode simulator images, xarts, iSCPreboot) are only in the v list."
linux = "Linux has the same idea in LVM thin pools, btrfs subvolumes and ZFS datasets: several filesystems drawing on one pool, so their free space is shared and adding up per-filesystem free space counts it several times."
pitfalls = [
  "df -h / on a Mac shows how much the small system volume uses (often under 15 GB) next to the container's free space, so / looks half empty on a disk that is nearly full. The data is on /System/Volumes/Data.",
  "Adding up 'Avail' over APFS volumes counts the same free space several times.",
]
try = ["diskutil apfs list", "df -h / /System/Volumes/Data", "mount | grep apfs"]
man = ["getfsstat(2)", "diskutil(8)"]

[swap_activity]
title = "Swap activity — pages moved to and from swap per second"
what = "The swap row's ↓ is pages read back from swap (swap-in), ↑ pages written out (swap-out), per second over the last refresh, as bytes. Swap *used* says how much was moved out at some time in the past; it can sit high for days on a healthy machine, because nothing reads cold pages back until someone touches them. Swap *activity* says whether the kernel is short of memory right now: steady swap-in means programs are waiting for the disk to give their memory back."
linux = "pswpin and pswpout in /proc/vmstat count pages since boot; rtop multiplies by the page size and takes the difference between two samples. vmstat 1 shows the same as si/so (in KiB/s)."
macos = "vm_statistics64.swapins and swapouts from host_statistics64(HOST_VM_INFO64), pages since boot. macOS first compresses memory (the compressor), and only writes compressed pages to /System/Volumes/VM/swapfile* when that is not enough, so swap-out on a Mac means compression already ran out."
pitfalls = [
  "High swap used with zero activity is fine: those pages are cold. Low swap used with constant swap-in/out (thrashing) is not.",
  "Linux also reclaims memory without swap by dropping page cache and writing back dirty file pages; that shows in pgpgout and in PSI, not here.",
]
try = ["vmstat 1", "grep -E 'pswp' /proc/vmstat", "vm_stat 1", "sysctl vm.swapusage"]
man = ["vmstat(8)", "proc_vmstat(5)", "vm_stat(1)"]

[mem_pressure]
title = "Memory pressure — is the kernel struggling for memory now?"
what = "The memory card's title says how hard the kernel is working to find free memory. Linux reports pressure stall information (PSI): the share of the last 10 seconds in which at least one runnable task was stalled waiting for memory (reclaim, swap-in, refaults). macOS reports a level that the kernel's memorystatus subsystem sets and apps are notified of: normal, warn or critical. Pressure, not 'used', is the number to alert on: a full page cache is free memory waiting to be used."
linux = "/proc/pressure/memory: `some avg10=…` (some tasks stalled) and `full avg10=…` (all non-idle tasks stalled at once, the CPU doing nothing useful). Needs CONFIG_PSI and no psi=0 on the kernel command line; each cgroup v2 group has its own memory.pressure, which is what Kubernetes' kubelet and systemd-oomd watch."
macos = "sysctl kern.memorystatus_vm_pressure_level: 1 normal, 2 warn, 4 critical, the same level Activity Monitor's Memory Pressure graph colours green, yellow and red. kern.memorystatus_level is the percentage of memory available."
pitfalls = [
  "'Memory used 95%' is not pressure: Linux and macOS both keep file data cached until the memory is needed.",
  "PSI some of a few percent under load is normal; tens of percent means tasks spend that share of time waiting for memory instead of running.",
  "In a container, /proc/pressure shows the whole node; the container's own pressure is in its cgroup's memory.pressure.",
]
try = ["cat /proc/pressure/memory", "cat /sys/fs/cgroup/memory.pressure", "sysctl kern.memorystatus_vm_pressure_level kern.memorystatus_level", "memory_pressure"]
man = ["proc_pressure(5)", "memory_pressure(1)"]

[run_queue]
title = "Load average, run queue and the load graph"
what = "The load average is not CPU usage. It is an exponentially damped average of how many tasks wanted to run, over about 1, 5 and 15 minutes, sampled every 5 seconds. Compare it with the number of cores: load 4 on 8 cores leaves half the CPUs idle; load 16 on 8 cores means tasks wait their turn. runq R/T is the instant behind it: R tasks runnable right now (running or waiting for a CPU) out of T. The graph under it plots the 1-minute load over time with the core count as its top, so a full graph means more work than CPUs."
linux = "/proc/loadavg: `9.76 6.24 4.43 4/2565 36658`: the three averages, then runnable/total scheduling entities (threads count, so T is larger than the process count), then the last PID used. Linux also counts tasks in uninterruptible sleep (D state, usually waiting for disk or NFS) in the load average, so load can be high with idle CPUs. The R count includes the process reading the file."
macos = "sysctl vm.loadavg (getloadavg(3)) gives the three averages, counting runnable threads only. macOS has no run-queue count to read, so rtop counts processes in state R from its own process list: derived, and per process rather than per thread."
pitfalls = [
  "High load with low CPU% on Linux means tasks stuck in D state: look at the 'in D' count and their wchan, not at CPU hogs.",
  "The 1-minute average reacts in about a minute; a short burst barely moves it. The graph shows the trend, the CPU card shows now.",
  "Load is per machine, not per container: in a pod, /proc/loadavg shows the node.",
]
try = ["cat /proc/loadavg", "uptime", "sysctl vm.loadavg", "vmstat 1   # column r is the run queue", "ps -eo stat | grep -c '^D'"]
man = ["proc_loadavg(5)", "getloadavg(3)", "uptime(1)"]

[net_link]
title = "Network link — interface, address, speed and totals"
what = "The network card's title names the interface traffic leaves by, its IPv4 address and the speed its driver negotiated. Addresses belong to interfaces, not to the machine: a laptop has one per active interface (Wi-Fi, Ethernet, VPN tunnel), and loopback 127.0.0.1 besides. The totals in the head lines (↓ in 2.1M/s · 14G) are the interface byte counters themselves; the rates above them are the difference between two samples. The counters start at zero when the interface comes up, not at boot, so a reconnected Wi-Fi starts over."
linux = "The interface of the default route: the row of /proc/net/route whose Destination is 00000000, lowest Metric first (what `ip route get 1.1.1.1` would pick without policy routing). The address comes from getifaddrs(3), the speed from /sys/class/net/IF/speed in Mb/s, which is -1 or unreadable when the link is down or the driver doesn't report one (Wi-Fi). Totals are bytes from /proc/net/dev."
macos = "The first active en* interface with an IPv4 address, from getifaddrs(3). Its speed is ifi_baudrate in the interface's if_data64 from sysctl NET_RT_IFLIST2; for Wi-Fi that is the current transmit rate and changes with signal quality. Under a VPN the default route goes through a utun interface (route -n get default), but the traffic still crosses en0 encrypted, which is the interface shown."
pitfalls = [
  "Link speed is what the two ends negotiated, not throughput: a 1 Gb/s link behind a 100 Mb/s uplink moves 100 Mb/s at best.",
  "Inside a container, eth0 is one end of a veth pair: its speed (often 10000) is made up by the driver and says nothing about the host's NIC.",
  "Bytes/s on the card are bytes; link speeds are bits. 1 Gb/s is about 119M/s.",
]
try = ["ip -br addr", "ip route get 1.1.1.1", "cat /sys/class/net/eth0/speed", "ethtool eth0", "ifconfig en0", "route -n get default", "netstat -ib"]
man = ["getifaddrs(3)", "ip-route(8)", "netstat(1)"]
